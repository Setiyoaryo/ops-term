[package]
name = "opsterm-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "OpsTerm UI-agnostic core: sessions, providers, security, storage"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
anyhow = "1"
thiserror = "2"
base64 = "0.22"
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
zeroize = "1"
uuid = { version = "1", features = ["v4"] }
parking_lot = "0.12"
rusqlite = { version = "0.40", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
libc = "0.2"
keyring = { version = "3", features = ["linux-native", "sync-secret-service", "crypto-rust"] }
russh = { version = "0.54", default-features = false, features = ["ring", "flate2", "rsa"] }
tokio = { version = "1", features = ["rt", "net", "io-util", "time", "sync", "macros"] }

[dev-dependencies]
tempfile = "3"
