[package]
name = "opsterm-native"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "OpsTerm native (GTK4 + VTE) lightweight desktop client"

[[bin]]
name = "opsterm-native"
path = "src/main.rs"

[dependencies]
gtk4 = { version = "0.11.5", features = ["v4_10", "v4_14"] }
libadwaita = { version = "0.9.2", features = ["v1_4"] }
libc = "0.2.191"
opsterm-core = { path = "../core" }
serde_json = "1.0.154"
vte4 = "0.10.0"
