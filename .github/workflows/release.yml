name: Release egui

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Rebuild an existing unpublished stable tag with current release infrastructure (empty = unsigned preview)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: release-egui
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'Setiyoaryo/ops-term'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - name: Install baseline build and GUI test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config python3-tomli libxkbcommon-dev libx11-dev libxcb1-dev libgl1-mesa-dev libwayland-dev openssl curl squashfs-tools desktop-file-utils xvfb xdotool imagemagick weston libgl1-mesa-dri libxcursor1 libxrandr2 libxi6 libxinerama1 libxkbcommon-x11-0 libegl1 libegl-mesa0 libglx-mesa0 fonts-dejavu-core python3-gi gir1.2-gtk-3.0 dbus-x11 gnome-keyring libglib2.0-bin
      - name: Validate trusted release tag
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        run: |
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          git merge-base --is-ancestor HEAD origin/main
          python3 -c 'import sys; from scripts.package_egui import version, validate_release_tag; validate_release_tag(sys.argv[1], version())' "$RELEASE_TAG"
          printf 'Validated immutable release source: %s\n' "$(git rev-parse HEAD)"
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable action
        with:
          toolchain: 1.94.1
          components: rustfmt, clippy
      - name: Format and packaging tests
        run: |
          python3 scripts/build_guard.py -- cargo fmt -p opsterm-core -p opsterm-egui --check
          python3 scripts/build_guard.py -- python3 -m unittest scripts/test_package_egui.py scripts/test_publish_github_release.py scripts/test_linux_distribution.py scripts/test_merge_release.py scripts/test_release_assets.py
      - name: Rust tests
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/opsterm-test-data
          DBUS_SESSION_BUS_ADDRESS: unix:path=/nonexistent-opsterm-test-bus
        run: python3 scripts/build_guard.py -- cargo test -p opsterm-core -p opsterm-egui --release --locked -- --test-threads=1
      - name: Clippy
        run: python3 scripts/build_guard.py -- cargo clippy -p opsterm-core -p opsterm-egui --release --locked --all-targets -- -D warnings
      - name: Build baseline binary and portable formats
        run: |
          python3 scripts/build_guard.py -- cargo build -p opsterm-egui --release --locked
          python3 scripts/build_guard.py -- python3 -c 'import os, shutil; from pathlib import Path; from scripts.package_egui import version; from scripts.linux_distribution import build_distribution; arch=os.uname().machine; out=Path("release"); out.mkdir(exist_ok=True); binary=Path("target/release/opsterm-egui"); build_distribution(binary,version(),arch,out); shutil.copy2(binary,out/f"opsterm-egui-{version()}-linux-{arch}")'
      - name: Build synthetic credential smoke helper
        run: python3 scripts/build_guard.py -- cargo build -p opsterm-core --example credential_store_smoke --release --locked
      - name: Use current startup diagnostics without changing application sources
        run: |
          git show origin/main:scripts/measure-egui.py > "$RUNNER_TEMP/opsterm-measure.py"
          cp "$RUNNER_TEMP/opsterm-measure.py" scripts/measure-egui.py
          git diff --exit-code -- core egui Cargo.toml Cargo.lock vendor packaging
      - name: Native X11 and Wayland rendering smoke
        run: |
          python3 scripts/build_guard.py -- xvfb-run -a python3 scripts/smoke-egui-close.py target/release/opsterm-egui "$RUNNER_TEMP/native-close"
          OPSTERM_TEST_DISCARD_LOGS=1 python3 scripts/build_guard.py -- xvfb-run -a python3 scripts/smoke-egui-close.py target/release/opsterm-egui "$RUNNER_TEMP/native-close-devnull"
          python3 scripts/build_guard.py -- xvfb-run -a python3 scripts/smoke-egui-selection.py target/release/opsterm-egui "$RUNNER_TEMP/native-selection"
          OPSTERM_LOGIN_HELPER=target/release/examples/credential_store_smoke python3 scripts/build_guard.py -- xvfb-run -a python3 scripts/smoke-login.py target/release/opsterm-egui "$RUNNER_TEMP/native-login"
          python3 scripts/build_guard.py -- xvfb-run -a python3 scripts/smoke-egui-gns3.py target/release/opsterm-egui "$RUNNER_TEMP/native-x11"
          python3 scripts/build_guard.py -- python3 scripts/smoke-egui-wayland.py target/release/opsterm-egui
          image="$(find release -maxdepth 1 -name '*.AppImage' -print -quit)"
          APPIMAGE_EXTRACT_AND_RUN=1 python3 scripts/build_guard.py -- xvfb-run -a python3 scripts/smoke-egui-gns3.py "$image" "$RUNNER_TEMP/appimage-x11"
      - name: Materialize signing key
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        shell: bash
        run: |
          umask 077
          cat > "$RUNNER_TEMP/opsterm-signing.key" <<'OPSTERM_SIGNING_KEY_EOF'
          ${{ secrets.OPSTERM_UPDATE_SIGNING_KEY }}
          OPSTERM_SIGNING_KEY_EOF
          test -s "$RUNNER_TEMP/opsterm-signing.key"
      - name: Sign verified artifacts
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        run: python3 -m scripts.sign_release --tag "$RELEASE_TAG" --key "$RUNNER_TEMP/opsterm-signing.key"
      - name: Verify real signed AppImage replacement and rollback
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        run: python3 scripts/build_guard.py -- python3 scripts/smoke-appimage-update.py target/release/opsterm-egui --key "$RUNNER_TEMP/opsterm-signing.key"
      - name: Verify signed native updates with a live replaced executable
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        run: python3 scripts/build_guard.py -- xvfb-run -a python3 scripts/smoke-native-update.py target/release/opsterm-egui --key "$RUNNER_TEMP/opsterm-signing.key" --output "$RUNNER_TEMP/native-update"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux-${{ matrix.arch }}
          path: release/
          retention-days: 2
          if-no-files-found: error
      - name: Clean private material and caches
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/opsterm-signing.key"
          if pgrep -af 'cargo|vite|build_guard'; then exit 1; fi
          flock -n .opsterm-build.lock bash scripts/clean.sh --dist
          test ! -d target

  compatibility:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:22.04', 'ubuntu:24.04', 'debian:12', 'debian:13', 'fedora:latest', 'archlinux:base', 'cachyos/cachyos:latest']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: linux-x86_64
          path: artifact
      - name: Verify portable startup without distro dependency installation
        env:
          DISTRO_IMAGE: ${{ matrix.image }}
        run: python3 scripts/build_guard.py -- python3 scripts/smoke-linux-distribution.py "$DISTRO_IMAGE" artifact
      - name: Clean test caches
        if: always()
        run: |
          if pgrep -af 'cargo|vite|build_guard'; then exit 1; fi
          flock -n .opsterm-build.lock bash scripts/clean.sh --dist

  publish:
    if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
    needs: [build, compatibility]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: linux-*
          path: artifacts
      - name: Verify signatures and assemble complete release
        run: python3 -m scripts.merge_release --input artifacts/linux-x86_64 --input artifacts/linux-aarch64 --output release
      - name: Initialize temporary publishing configuration
        run: printf 'GH_CONFIG_DIR=%s/opsterm-gh\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Materialize scoped publishing credential
        run: |
          umask 077
          mkdir -p "$GH_CONFIG_DIR"
          cat > "$GH_CONFIG_DIR/hosts.yml" <<'OPSTERM_GH_AUTH_EOF'
          github.com:
              oauth_token: ${{ github.token }}
              git_protocol: https
          OPSTERM_GH_AUTH_EOF
      - name: Publish immutable complete release
        run: python3 -m scripts.publish_github_release --repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG"
      - name: Remove publishing credential and caches
        if: always()
        run: |
          rm -rf "$GH_CONFIG_DIR"
          if pgrep -af 'cargo|vite|build_guard'; then exit 1; fi
          flock -n .opsterm-build.lock bash scripts/clean.sh --dist
